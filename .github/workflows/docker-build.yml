# Build and push to GHCR. Deployment is a separate manual workflow.
#
# Sits alongside upstream's pipeline.yml, which triggers on `dev` and `preprod`,
# branches this fork does not have.
#
# `grnet` rather than `main`: main is a clean upstream mirror here, so building
# it would republish on every sync.

name: Docker build

on:
  push:
    branches:
      - grnet
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # Fork PRs cannot read secrets, and unreviewed code should not publish.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          # `source` links the package to its repository.
          labels: |
            org.opencontainers.image.description=PID issuer for the EUDI wallet (GRNET fork).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Imports only: serving metadata needs document-signing material that is
      # mounted at deploy time. Catches a dependency whose C library is missing
      # from the runtime stage, which is how the libpq5 bug shipped.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing $IMAGE"

          docker run --rm "$IMAGE" python3 -c "
          import flask, psycopg, cryptography, jwt, requests
          print('imports ok')
          "
          echo "image is runnable"
